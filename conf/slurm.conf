# Default Slurm configuration aligned with the interactive helpers in ~/.bashrc.
# `ql` uses:  srun --nodes=1 -p gpu --gres=gpu:v100:<ngpu> --time=23:59:59 --pty bash -i
#
# If you want to target the A100 queues instead, use one of these variants:
#   --partition=gpu --gres=gpu:a100:<ngpu> --constraint=40gb
#   --partition=gpu --gres=gpu:a100:<ngpu> --constraint=80gb

command sbatch --nodes=1 --partition=gpu

option mem=* --mem-per-cpu=$0
option mem=0          # Do not add anything to qsub_opts
option num_threads=* --cpus-per-task=$0 --ntasks-per-node=1
option num_threads=1 --cpus-per-task=1 --ntasks-per-node=1
option max_jobs_run=*     # Do nothing
option name=* --job-name $0
option time=* --time $0
option num_nodes=* --nodes $0

default gpu=0
option gpu=0
option gpu=* --gres=gpu:v100:$0
